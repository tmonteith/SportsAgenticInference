replicaCount: 1

image:
  repository: ghcr.io/tmonteith/sportsagentic-inference
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
# Default service name 'llama-server' matches SportsAgenticAgent's http://llama-server:8081/v1
fullnameOverride: "llama-server"

# Application & llama-server runtime configuration (mounted via ConfigMap)
config:
  host: "0.0.0.0"
  port: "8081"
  logLevel: "INFO"
  modelId: "microsoft/Phi-4-mini-instruct"
  modelAlias: "local-model"
  hfGgufRepo: "bartowski/microsoft_Phi-4-mini-instruct-GGUF"
  hfGgufFilename: "microsoft_Phi-4-mini-instruct-Q4_K_M.gguf"
  modelCacheDir: "/models"
  # Writable Hugging Face cache; the pod's UID has HOME=/, which is read-only
  hfHome: "/models/.cache/huggingface"
  autoDownloadModel: "true"
  llamaServerBin: "/usr/local/bin/llama-server"
  llamaInternalHost: "127.0.0.1"
  llamaInternalPort: "8082"
  llamaCtxSize: "4096"
  llamaThreads: "4"
  llamaNGpuLayers: "0"
  llamaStartupTimeoutSeconds: "300.0"
  llamaRequestTimeoutSeconds: "60.0"
  autoStartLlamaServer: "true"

# Optional Hugging Face token secret for model downloads
secrets:
  existingSecret: ""
  existingSecretKey: "HF_TOKEN"
  hfToken: ""

# Persistent storage for cached GGUF model weights (/models)
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  mountPath: /models

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: sportsagentic-inference.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Startup probe allows time for initial GGUF download and model loading into RAM
startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

resources:
  requests:
    cpu: "1000m"
    memory: "4Gi"
  limits:
    cpu: "4000m"
    memory: "8Gi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80

# Aligns with SportsAgenticInfra OKE model-pool when enabled (e.g. workload-role: model)
nodeSelector: {}
tolerations: []
affinity: {}

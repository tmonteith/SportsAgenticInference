{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sportsagentic-inference.fullname" . }}
  labels:
    {{- include "sportsagentic-inference.labels" . | nindent 4 }}
type: Opaque
stringData:
  HF_TOKEN: {{ .Values.secrets.hfToken | quote }}
{{- end }}

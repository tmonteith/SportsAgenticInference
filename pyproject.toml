[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sportsagentic-inference"
version = "0.1.0"
description = "FastAPI OpenAI-compatible inference server managing llama-server with microsoft/Phi-4-mini-instruct for SportsAgenticAgent"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "anyio>=3.7.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "huggingface-hub>=0.21.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
